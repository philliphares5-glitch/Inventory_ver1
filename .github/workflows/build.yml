name: Build and Release Inventory App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: inventory_linux_archive
            archive_name: inventory_linux.tar.gz
            icon_flag: "--icon=icon.png"
            file_name: inventory_gui
          - os: windows-latest
            artifact_name: inventory_windows_archive
            archive_name: inventory_windows.zip
            icon_flag: "--icon=icon.ico"
            file_name: inventory_gui.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Build executable with custom icon
        run: |
          pyinstaller --onefile --windowed ${{ matrix.icon_flag }} inventory_gui.py

      - name: Compress Linux binary (Tar.gz)
        if: matrix.os == 'ubuntu-latest'
        run: |
          tar -czvf inventory_linux.tar.gz -C dist inventory_gui

      - name: Compress Windows executable (Zip)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\inventory_gui.exe -DestinationPath inventory_windows.zip

      - name: Upload artifact for release job
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive_name }}
          merge-multiple: true

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all built archives
        uses: actions/download-artifact@v4

      - name: Display downloaded files
        run: ls -R

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            inventory_linux_archive/inventory_linux.tar.gz
            inventory_windows_archive/inventory_windows.zip
          generate_release_notes: true
