name: Build Inventory App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: inventory_linux_archive
            archive_name: inventory_linux.tar.gz
            icon_flag: "--icon=icon.png"
            file_name: inventory_gui
          - os: windows-latest
            artifact_name: inventory_windows_archive
            archive_name: inventory_windows.zip
            icon_flag: "--icon=icon.ico"
            file_name: inventory_gui.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build executable with custom icon
        run: |
          pyinstaller --onefile --windowed ${{ matrix.icon_flag }} inventory_gui.py

      - name: Compress Linux binary (Tar.gz)
        if: matrix.os == 'ubuntu-latest'
        run: |
          tar -czvf inventory_linux.tar.gz -C dist inventory_gui

      - name: Compress Windows executable (Zip)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\inventory_gui.exe -DestinationPath inventory_windows.zip

      - name: Upload compressed archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive_name }}
- name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow
